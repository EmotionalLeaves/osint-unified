<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>God's Eye View</title>
  <script>
    window.CESIUM_BASE_URL = "https://cesium.com/downloads/cesiumjs/releases/1.118/Build/Cesium/";
  </script>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.118/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.118/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/5.0.0/satellite.min.js"></script>
  <style>
    html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #0b0e11; }
    .cesium-widget-credits { display: none !important; }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <script>
    // Keyless: no Cesium Ion token. Use OpenStreetMap imagery and the
    // default ellipsoid (no terrain) so the globe renders without an account.
    Cesium.Ion.defaultAccessToken = undefined;

    const viewer = new Cesium.Viewer("cesiumContainer", {
      baseLayer: Cesium.ImageryLayer.fromProviderAsync(
        Promise.resolve(new Cesium.OpenStreetMapImageryProvider({
          url: "https://tile.openstreetmap.org/"
        }))
      ),
      baseLayerPicker: false,
      geocoder: false,
      homeButton: false,
      sceneModePicker: false,
      navigationHelpButton: false,
      animation: false,
      timeline: false,
      fullscreenButton: false,
      infoBox: false,
      selectionIndicator: false
    });

    viewer.scene.globe.enableLighting = false;
    viewer.scene.skyAtmosphere.show = true;

    const aircraftEntities = new Map();

    function colorForAltitude(alt) {
      // Low = amber, high = cyan.
      const t = Math.max(0, Math.min(1, alt / 40000));
      return Cesium.Color.fromHsl((0.55 * t) + 0.08, 0.9, 0.55);
    }

    // Called from Kotlin: window.updateAircraft([{icao, callsign, lat, lon, altitude, ...}])
    window.updateAircraft = function (list) {
      const seen = new Set();
      list.forEach(function (ac) {
        seen.add(ac.icao);
        const position = Cesium.Cartesian3.fromDegrees(ac.lon, ac.lat, ac.altitude);
        let entity = aircraftEntities.get(ac.icao);
        if (!entity) {
          entity = viewer.entities.add({
            id: ac.icao,
            position: position,
            point: {
              pixelSize: 8,
              color: colorForAltitude(ac.altitude),
              outlineColor: Cesium.Color.BLACK,
              outlineWidth: 1
            },
            label: {
              text: ac.callsign || ac.icao,
              font: "12px sans-serif",
              fillColor: Cesium.Color.WHITE,
              showBackground: true,
              backgroundColor: new Cesium.Color(0, 0, 0, 0.5),
              pixelOffset: new Cesium.Cartesian2(0, -18),
              scaleByDistance: new Cesium.NearFarScalar(1.5e5, 1.0, 2.0e7, 0.35)
            }
          });
          entity.callsign = ac.callsign || ac.icao;
          aircraftEntities.set(ac.icao, entity);
        } else {
          entity.position = position;
          entity.point.color = colorForAltitude(ac.altitude);
          entity.callsign = ac.callsign || ac.icao;
        }
      });
      // Remove stale entities.
      for (const [icao, entity] of aircraftEntities) {
        if (!seen.has(icao)) {
          viewer.entities.remove(entity);
          aircraftEntities.delete(icao);
        }
      }
    };

    const vesselEntities = new Map();

    // Called from Kotlin: window.updateVessels([{mmsi, name, lat, lon, ...}])
    window.updateVessels = function (list) {
      const seen = new Set();
      list.forEach(function (v) {
        seen.add(v.mmsi);
        const position = Cesium.Cartesian3.fromDegrees(v.lon, v.lat);
        let entity = vesselEntities.get(v.mmsi);
        if (!entity) {
          entity = viewer.entities.add({
            id: "ship-" + v.mmsi,
            position: position,
            point: {
              pixelSize: 7,
              color: Cesium.Color.fromCssColorString("#1D9E75"),
              outlineColor: Cesium.Color.BLACK,
              outlineWidth: 1
            },
            label: {
              text: v.name || v.mmsi,
              font: "11px sans-serif",
              fillColor: Cesium.Color.WHITE,
              showBackground: true,
              backgroundColor: new Cesium.Color(0, 0, 0, 0.5),
              pixelOffset: new Cesium.Cartesian2(0, -16),
              scaleByDistance: new Cesium.NearFarScalar(1.5e5, 1.0, 2.0e7, 0.3)
            }
          });
          entity.vesselName = v.name || v.mmsi;
          vesselEntities.set(v.mmsi, entity);
        } else {
          entity.position = position;
        }
      });
      for (const [mmsi, entity] of vesselEntities) {
        if (!seen.has(mmsi)) {
          viewer.entities.remove(entity);
          vesselEntities.delete(mmsi);
        }
      }
    };

    // Tap handling: an aircraft/vessel hands its id to the app; tapping empty
    // ocean/land hands back the coordinate for a GEOINT investigation.
    const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
    handler.setInputAction(function (click) {
      const picked = viewer.scene.pick(click.position);
      if (Cesium.defined(picked) && picked.id && picked.id.callsign) {
        window.AndroidBridge && window.AndroidBridge.onAircraftClick &&
          window.AndroidBridge.onAircraftClick(picked.id.callsign);
        return;
      }
      if (Cesium.defined(picked) && picked.id && picked.id.vesselName) {
        window.AndroidBridge && window.AndroidBridge.onAircraftClick &&
          window.AndroidBridge.onAircraftClick(picked.id.vesselName);
        return;
      }
      const cartesian = viewer.camera.pickEllipsoid(click.position, viewer.scene.globe.ellipsoid);
      if (cartesian) {
        const carto = Cesium.Cartographic.fromCartesian(cartesian);
        const lat = Cesium.Math.toDegrees(carto.latitude).toFixed(5);
        const lon = Cesium.Math.toDegrees(carto.longitude).toFixed(5);
        window.AndroidBridge && window.AndroidBridge.onMapClick &&
          window.AndroidBridge.onMapClick(parseFloat(lat), parseFloat(lon));
      }
    }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

    // ---- Live earthquakes (USGS, last 24h) ----
    const quakeEntities = [];
    function loadQuakes() {
      fetch("https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson")
        .then(r => r.json())
        .then(d => {
          quakeEntities.forEach(e => viewer.entities.remove(e));
          quakeEntities.length = 0;
          (d.features || []).forEach(f => {
            const c = f.geometry && f.geometry.coordinates;
            if (!c) return;
            const mag = f.properties && f.properties.mag ? f.properties.mag : 0;
            const e = viewer.entities.add({
              position: Cesium.Cartesian3.fromDegrees(c[0], c[1]),
              point: {
                pixelSize: Math.max(4, mag * 3),
                color: Cesium.Color.fromHsl(Math.max(0, (1 - mag / 8)) * 0.15, 0.9, 0.5).withAlpha(0.85),
                outlineColor: Cesium.Color.BLACK,
                outlineWidth: 1
              },
              label: {
                text: "M" + mag.toFixed(1),
                font: "10px sans-serif",
                fillColor: Cesium.Color.WHITE,
                showBackground: true,
                backgroundColor: new Cesium.Color(0, 0, 0, 0.4),
                pixelOffset: new Cesium.Cartesian2(0, -14),
                scaleByDistance: new Cesium.NearFarScalar(1.5e5, 1.0, 2.0e7, 0.25)
              }
            });
            quakeEntities.push(e);
          });
        })
        .catch(function () {});
    }
    loadQuakes();
    setInterval(loadQuakes, 300000);

    // ---- Live satellites (Celestrak visual TLEs + satellite.js SGP4) ----
    const satEntities = new Map();
    let satrecs = [];
    function loadSats() {
      fetch("https://celestrak.org/NORAD/elements/gp.php?GROUP=visual&FORMAT=tle")
        .then(r => r.text())
        .then(t => {
          const lines = t.split(/\r?\n/).filter(l => l.trim().length);
          satrecs = [];
          for (let i = 0; i + 2 < lines.length; i += 3) {
            try {
              satrecs.push({ name: lines[i].trim(), rec: satellite.twoline2satrec(lines[i + 1], lines[i + 2]) });
            } catch (e) {}
          }
        })
        .catch(function () {});
    }
    function updateSats() {
      if (!window.satellite || !satrecs.length) return;
      const now = new Date();
      const gmst = satellite.gstime(now);
      satrecs.forEach(function (s) {
        try {
          const pv = satellite.propagate(s.rec, now);
          if (!pv.position) return;
          const gd = satellite.eciToGeodetic(pv.position, gmst);
          const lon = satellite.degreesLong(gd.longitude);
          const lat = satellite.degreesLat(gd.latitude);
          const alt = gd.height * 1000;
          const pos = Cesium.Cartesian3.fromDegrees(lon, lat, alt);
          let e = satEntities.get(s.name);
          if (!e) {
            e = viewer.entities.add({
              position: pos,
              point: {
                pixelSize: 4,
                color: Cesium.Color.fromCssColorString("#C0A8FF"),
                outlineColor: Cesium.Color.BLACK,
                outlineWidth: 1
              }
            });
            e.satName = s.name;
            satEntities.set(s.name, e);
          } else {
            e.position = pos;
          }
        } catch (e) {}
      });
    }
    loadSats();
    setInterval(loadSats, 3600000);
    setInterval(updateSats, 3000);

    // Start zoomed out on the whole globe.
    viewer.camera.flyHome(0);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>God's Eye View</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body, #map { margin: 0; padding: 0; height: 100%; width: 100%; }
    #map { background: #0b0e11; }
    #status { position: absolute; top: 50%; left: 0; right: 0; text-align: center; color: #8aa0b0; z-index: 5; font: 13px sans-serif; }
    #layerbar { position: absolute; top: 8px; left: 8px; z-index: 1000; display: flex; gap: 6px; flex-wrap: wrap; }
    #layerbar button { font: 11px sans-serif; color: #e2e6ea; background: rgba(16,20,24,0.85); border: 1px solid #333; border-radius: 6px; padding: 5px 9px; }
    #layerbar button.off { opacity: 0.45; text-decoration: line-through; }
    .leaflet-container { background: #0b0e11; }
  </style>
</head>
<body>
  <div id="status">Loading map…</div>
  <div id="map"></div>
  <div id="layerbar">
    <button data-layer="aircraft">Aircraft</button>
    <button data-layer="vessels">Vessels</button>
    <button data-layer="quakes">Quakes</button>
    <button data-layer="sats">Satellites</button>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/5.0.0/satellite.min.js"></script>
  <script>
    (function () {
      const statusEl = document.getElementById("status");
      if (!window.L) {
        statusEl.textContent = "Map library did not load — check the connection.";
        return;
      }

      const map = L.map("map", { worldCopyJump: true, attributionControl: false }).setView([20, 0], 2);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);
      map.whenReady(function () { statusEl.style.display = "none"; });
      setTimeout(function () { statusEl.style.display = "none"; }, 5000);

      const groups = {
        aircraft: L.layerGroup().addTo(map),
        vessels: L.layerGroup().addTo(map),
        quakes: L.layerGroup().addTo(map),
        sats: L.layerGroup().addTo(map)
      };
      const layers = { aircraft: true, vessels: true, quakes: true, sats: true };

      function dot(lat, lon, color, radius, label, clickable) {
        const m = L.circleMarker([lat, lon], { radius: radius, color: "#000", weight: 1, fillColor: color, fillOpacity: 0.9 });
        if (label) m.bindTooltip(String(label));
        if (clickable) m.on("click", function (e) {
          L.DomEvent.stopPropagation(e);
          if (window.AndroidBridge && window.AndroidBridge.onAircraftClick) window.AndroidBridge.onAircraftClick(String(label));
        });
        return m;
      }

      window.updateAircraft = function (list) {
        groups.aircraft.clearLayers();
        (list || []).forEach(function (a) { dot(a.lat, a.lon, "#4FC3F7", 5, a.callsign || a.icao, true).addTo(groups.aircraft); });
      };
      window.updateVessels = function (list) {
        groups.vessels.clearLayers();
        (list || []).forEach(function (v) { dot(v.lat, v.lon, "#1D9E75", 5, v.name || v.mmsi, true).addTo(groups.vessels); });
      };

      function loadQuakes() {
        fetch("https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson")
          .then(function (r) { return r.json(); })
          .then(function (d) {
            groups.quakes.clearLayers();
            (d.features || []).forEach(function (f) {
              const c = f.geometry && f.geometry.coordinates;
              if (!c) return;
              const mag = (f.properties && f.properties.mag) || 0;
              dot(c[1], c[0], "#F0997B", Math.max(4, mag * 2), "M" + mag.toFixed(1), false).addTo(groups.quakes);
            });
          })
          .catch(function () {});
      }
      loadQuakes();
      setInterval(loadQuakes, 300000);

      let satrecs = [];
      function loadSats() {
        fetch("https://celestrak.org/NORAD/elements/gp.php?GROUP=visual&FORMAT=tle")
          .then(function (r) { return r.text(); })
          .then(function (t) {
            const lines = t.split(/\r?\n/).filter(function (l) { return l.trim().length; });
            satrecs = [];
            for (let i = 0; i + 2 < lines.length; i += 3) {
              try { satrecs.push({ name: lines[i].trim(), rec: satellite.twoline2satrec(lines[i + 1], lines[i + 2]) }); } catch (e) {}
            }
            updateSats();
          })
          .catch(function () {});
      }
      function updateSats() {
        if (!window.satellite || !satrecs.length) return;
        const now = new Date(), gmst = satellite.gstime(now);
        groups.sats.clearLayers();
        satrecs.forEach(function (s) {
          try {
            const pv = satellite.propagate(s.rec, now);
            if (!pv.position) return;
            const gd = satellite.eciToGeodetic(pv.position, gmst);
            dot(satellite.degreesLat(gd.latitude), satellite.degreesLong(gd.longitude), "#C0A8FF", 3, s.name, false).addTo(groups.sats);
          } catch (e) {}
        });
      }
      loadSats();
      setInterval(loadSats, 3600000);
      setInterval(updateSats, 3000);

      map.on("click", function (e) {
        if (window.AndroidBridge && window.AndroidBridge.onMapClick) window.AndroidBridge.onMapClick(e.latlng.lat, e.latlng.lng);
      });

      document.querySelectorAll("#layerbar button").forEach(function (btn) {
        btn.addEventListener("click", function () {
          const n = btn.getAttribute("data-layer");
          layers[n] = !layers[n];
          btn.classList.toggle("off", !layers[n]);
          if (layers[n]) map.addLayer(groups[n]); else map.removeLayer(groups[n]);
        });
      });
    })();
  </script>
</body>
</html>

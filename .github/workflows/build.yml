name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Show Android SDK / NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"

      # Compile the pure-Go OSINT scanners for Android/arm64 using the NDK so
      # they use the device's system DNS resolver. Output as lib<tool>.so into
      # jniLibs (the one place Android lets an app execute binaries from).
      - name: Cross-compile Go tools into jniLibs
        run: |
          set -ux
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          CC_BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          OUT="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$OUT"
          export GOOS=android GOARCH=arm64 CGO_ENABLED=1 CC="$CC_BIN"
          BIN="$(go env GOPATH)/bin/android_arm64"
          # Tools with a known cmd path, built via `go install`. Each failure is
          # non-fatal so one bad tool can't drop the others.
          # Self-contained pure-Go tools (no embedded frontend). nuclei and
          # phoneinfoga are handled natively in-app instead, since they embed a
          # web UI that a plain cross-build can't satisfy.
          for spec in \
            "subfinder=github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest" \
            "httpx=github.com/projectdiscovery/httpx/cmd/httpx@latest" \
            "amass=github.com/owasp-amass/amass/v4/...@master" \
            "waybackurls=github.com/tomnomnom/waybackurls@latest" \
            "gau=github.com/lc/gau/v2/cmd/gau@latest" \
            "dnsx=github.com/projectdiscovery/dnsx/cmd/dnsx@latest"; do
            name="${spec%%=*}"; path="${spec#*=}"
            if go install "$path"; then
              cp "$BIN/$name" "$OUT/lib$name.so" && echo "BUILT $name"
            else
              echo "WARN build failed: $name"
            fi
          done
          chmod +x "$OUT"/*.so || true
          ls -la "$OUT"

      - name: Bundle OSINT datasets into assets
        run: |
          set -eux
          A="app/src/main/assets"
          mkdir -p "$A"
          # OSINT Framework directory (hundreds of resources, categorized).
          curl -sSL https://raw.githubusercontent.com/lockfale/osint-framework/master/public/arf.json -o "$A/arf.json" || true
          # US Treasury OFAC Specially Designated Nationals, searched offline in-app.
          curl -sSL https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports/SDN.CSV -o "$A/sdn.csv" || true
          if [ ! -s "$A/sdn.csv" ]; then echo "placeholder" > "$A/sdn.csv"; fi
          # WhatsMyName ruleset for on-device account enumeration (offline-ready).
          curl -sSL https://raw.githubusercontent.com/WebBreacher/WhatsMyName/main/wmn-data.json -o "$A/wmn-data.json" || true
          # Sherlock and Maigret are site rulesets underneath; the app runs
          # their rules natively, so bundle the data rather than the tools.
          curl -sSL https://raw.githubusercontent.com/sherlock-project/sherlock/master/sherlock_project/resources/data.json -o "$A/sherlock.json" || true
          if [ ! -s "$A/sherlock.json" ]; then
            curl -sSL https://raw.githubusercontent.com/sherlock-project/sherlock/master/sherlock/resources/data.json -o "$A/sherlock.json" || true
          fi
          curl -sSL https://raw.githubusercontent.com/soxoj/maigret/main/maigret/resources/data.json -o "$A/maigret.json" || true
          # UN Security Council consolidated sanctions list, searched offline.
          curl -sSL https://scsanctions.un.org/resources/xml/en/consolidated.xml -o "$A/un-sanctions.xml" || true
          # Breach metadata (dates, record counts, what leaked) for enrichment.
          curl -sSL https://haveibeenpwned.com/api/v3/breaches -o "$A/breaches.json" || true
          # Curated tool catalogues, merged into the in-app directory.
          curl -sSL https://raw.githubusercontent.com/jivoi/awesome-osint/master/README.md -o "$A/awesome-osint.md" || true
          curl -sSL https://raw.githubusercontent.com/cipher387/osint_stuff_tool_collection/main/README.md -o "$A/osint-stuff.md" || true
          curl -sSL https://raw.githubusercontent.com/Astrosp/Awesome-OSINT-For-Everything/main/README.md -o "$A/osint-everything.md" || true
          curl -sSL https://raw.githubusercontent.com/Ph055a/OSINT_Collection/master/README.md -o "$A/osint-collection.md" || true
          for f in sherlock.json maigret.json un-sanctions.xml breaches.json awesome-osint.md osint-stuff.md osint-everything.md osint-collection.md; do
            if [ -s "$A/$f" ]; then
              echo "bundled $f ($(wc -c < "$A/$f") bytes)"
            else
              echo "WARNING: $f missing or empty"; rm -f "$A/$f"
            fi
          done
          # Raw infrastructure datasets -> compact JSON bundled in the APK.
          curl -sSL https://davidmegginson.github.io/ourairports-data/airports.csv -o /tmp/airports.csv || true
          curl -sSL https://raw.githubusercontent.com/wri/global-power-plant-database/master/output_database/global_power_plant_database.csv -o /tmp/powerplants.csv || true
          python3 - <<'PY'
          import csv, json
          A = "app/src/main/assets"
          try:
              out = []
              with open('/tmp/airports.csv', newline='', encoding='utf-8') as f:
                  for r in csv.DictReader(f):
                      if r.get('type') in ('large_airport', 'medium_airport'):
                          try:
                              lat = float(r['latitude_deg']); lon = float(r['longitude_deg'])
                          except Exception:
                              continue
                          code = (r.get('iata_code') or r.get('ident') or '').strip()
                          out.append({"lat": lat, "lon": lon, "n": (r.get('name') or '')[:60], "c": code})
              json.dump(out, open(A + "/airports.json", "w"))
              print("airports bundled:", len(out))
          except Exception as e:
              print("airports failed:", e)
          try:
              out = []
              with open('/tmp/powerplants.csv', newline='', encoding='utf-8') as f:
                  for r in csv.DictReader(f):
                      try:
                          lat = float(r['latitude']); lon = float(r['longitude'])
                      except Exception:
                          continue
                      out.append({"lat": lat, "lon": lon, "n": (r.get('name') or '')[:60],
                                  "f": r.get('primary_fuel') or '', "mw": r.get('capacity_mw') or ''})
              json.dump(out, open(A + "/powerplants.json", "w"))
              print("power plants bundled:", len(out))
          except Exception as e:
              print("power plants failed:", e)
          PY
          ls -la "$A"
          test -s "$A/arf.json"
          # Ship the inventory inside the APK, so the self-test screen can
          # show on-device exactly which datasets this build carries.
          COUNTS=$(python3 .github/count-assets.py)
          printf '%s\n' "${COUNTS}" | sed 's/%0A/\n/g' > "$A/bundle-manifest.txt"
          cat "$A/bundle-manifest.txt"
          # Also report it back to the build. Downloads are best-effort
          # (|| true) so a dead mirror can't break the build, but a silently
          # missing dataset would be worse. These are notices, not errors:
          # they are information about a healthy build, and marking a green
          # build with error annotations is just noise.
          SUMMARY=""
          for f in "$A"/*; do
            SUMMARY="${SUMMARY}$(basename "$f") $(wc -c < "$f") bytes%0A"
          done
          echo "::notice title=bundled-assets::${SUMMARY}"
          echo "::notice title=rule-counts::${COUNTS}"

      - name: Use the private signing key when one is configured
        if: ${{ env.OSINT_KEYSTORE_B64 != '' }}
        env:
          OSINT_KEYSTORE_B64: ${{ secrets.OSINT_KEYSTORE_B64 }}
        run: |
          echo "$OSINT_KEYSTORE_B64" | base64 -d > keystore/ci.jks
          echo "Signing with the configured private key."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile (surface Kotlin errors as annotations)
        run: |
          set +e
          gradle compileDebugKotlin --no-daemon --console=plain > compile.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "^e: " compile.log | head -40 | while IFS= read -r line; do
              clean="${line//$'\r'/}"
              echo "::error::${clean}"
            done
            echo "----- tail of compile log -----"
            tail -80 compile.log
            exit 1
          fi

      - name: Run unit tests
        run: gradle test --no-daemon --stacktrace

      - name: Surface unit-test failures as annotations
        if: failure()
        run: python3 .github/test-report.py || true

      - name: Build debug APK
        env:
          OSINT_KEYSTORE_PASSWORD: ${{ secrets.OSINT_KEYSTORE_PASSWORD }}
          OSINT_KEY_ALIAS: ${{ secrets.OSINT_KEY_ALIAS }}
          OSINT_KEY_PASSWORD: ${{ secrets.OSINT_KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon --stacktrace -PosintVersionCode=${{ github.run_number }} -PosintVersionName=r${{ github.run_number }}

      - name: Report the signing fingerprint and the APK size
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          SIZE=$(( $(wc -c < "$APK") / 1048576 ))
          FP=$(keytool -printcert -jarfile "$APK" 2>/dev/null \
                | grep -m1 "SHA256:" | tr -d " " || echo "unknown")
          # The fingerprint must be identical between builds, or an update
          # will not install over the previous one.
          echo "::notice title=apk::${SIZE} MB%0Asigner ${FP}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: osint-unified-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

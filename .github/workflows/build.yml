name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    # Mapped at job level because a step's `if` cannot see the `secrets`
    # context at all — r177 did not fail, it never started: the workflow
    # was rejected as invalid. It can see `env`, and job-level `env` is
    # where a secret becomes something a condition may ask about.
    env:
      OSINT_KEYSTORE_B64: ${{ secrets.OSINT_KEYSTORE_B64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Show Android SDK / NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"

      # Compile the pure-Go OSINT scanners for Android/arm64 using the NDK so
      # they use the device's system DNS resolver. Output as lib<tool>.so into
      # jniLibs (the one place Android lets an app execute binaries from).
      - name: Cross-compile Go tools into jniLibs
        run: |
          set -eux
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          CC_BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          OUT="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$OUT"
          export GOOS=android GOARCH=arm64 CGO_ENABLED=1 CC="$CC_BIN"
          # Pinned, and pinned means pinned: @latest and @master put whatever
          # upstream pushed this morning into native code that runs inside the
          # app with the case database next to it. GOTOOLCHAIN=local stops a
          # module's go directive silently fetching a different compiler, which
          # is how one build ended up using two Go versions at once.
          export GOTOOLCHAIN=local GOFLAGS=-mod=mod
          BIN="$(go env GOPATH)/bin/android_arm64"

          # -trimpath drops build paths, -s -w drop the symbol table and DWARF.
          # The binaries were shipping unstripped with full debug info.
          LDFLAGS="-s -w"

          # dnsx was built, shipped and never called from anywhere in the app:
          # 39 MB of native code for nothing. Amass is 51 MB and in passive
          # mode largely repeats subfinder, so it goes too; subfinder stays.
          for spec in \
            "subfinder=github.com/projectdiscovery/subfinder/v2/cmd/subfinder@v2.6.6" \
            "httpx=github.com/projectdiscovery/httpx/cmd/httpx@v1.6.5" \
            "waybackurls=github.com/tomnomnom/waybackurls@v0.1.0" \
            "gau=github.com/lc/gau/v2/cmd/gau@v2.2.3"; do
            name="${spec%%=*}"; path="${spec#*=}"
            go install -trimpath -ldflags="$LDFLAGS" "$path"
            cp "$BIN/$name" "$OUT/lib$name.so"
            echo "BUILT $name $(wc -c < "$OUT/lib$name.so") bytes from ${path##*@}"
          done
          chmod +x "$OUT"/*.so
          ls -la "$OUT"
          # A missing binary used to be a warning, so a tool could vanish from
          # a release without anyone noticing.
          for want in subfinder httpx waybackurls gau; do
            test -s "$OUT/lib$want.so" || { echo "::error::missing lib$want.so"; exit 1; }
          done
          VERSIONS="subfinder v2.6.6%0Ahttpx v1.6.5%0Awaybackurls v0.1.0%0Agau v2.2.3"
          echo "::notice title=native-tools::${VERSIONS}"

      - name: Bundle OSINT datasets into assets
        run: |
          set -eux
          A="app/src/main/assets"
          mkdir -p "$A"
          # OSINT Framework directory (hundreds of resources, categorized).
          curl -sSL https://raw.githubusercontent.com/lockfale/osint-framework/master/public/arf.json -o "$A/arf.json" || true
          # US Treasury OFAC Specially Designated Nationals, searched offline
          # in-app — plus ALT.CSV, the alias list, which is where most real
          # matches live and which was not being bundled at all.
          #
          # A failed download used to write the word "placeholder" into the
          # file, after which every sanctions search in every build came back
          # clean. A sanctions list that silently is not there is worse than
          # one that is missing loudly, so the build fails instead.
          curl -sSL https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports/SDN.CSV -o "$A/sdn.csv" || true
          curl -sSL https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports/ALT.CSV -o "$A/sdn-alt.csv" || true
          SDN_BYTES=$(wc -c < "$A/sdn.csv" 2>/dev/null || echo 0)
          if [ "$SDN_BYTES" -lt 1000000 ]; then
            echo "::error::OFAC SDN list is ${SDN_BYTES} bytes — refusing to ship a build whose sanctions search would answer 'clean' to everything."
            exit 1
          fi
          date -u +"%Y-%m-%d" > "$A/sanctions-asof.txt"
          # WhatsMyName ruleset for on-device account enumeration (offline-ready).
          curl -sSL https://raw.githubusercontent.com/WebBreacher/WhatsMyName/main/wmn-data.json -o "$A/wmn-data.json" || true
          # Sherlock and Maigret are site rulesets underneath; the app runs
          # their rules natively, so bundle the data rather than the tools.
          curl -sSL https://raw.githubusercontent.com/sherlock-project/sherlock/master/sherlock_project/resources/data.json -o "$A/sherlock.json" || true
          if [ ! -s "$A/sherlock.json" ]; then
            curl -sSL https://raw.githubusercontent.com/sherlock-project/sherlock/master/sherlock/resources/data.json -o "$A/sherlock.json" || true
          fi
          curl -sSL https://raw.githubusercontent.com/soxoj/maigret/main/maigret/resources/data.json -o "$A/maigret.json" || true
          # UN Security Council consolidated sanctions list, searched offline.
          curl -sSL https://scsanctions.un.org/resources/xml/en/consolidated.xml -o "$A/un-sanctions.xml" || true
          # Breach metadata (dates, record counts, what leaked) for enrichment.
          curl -sSL https://haveibeenpwned.com/api/v3/breaches -o "$A/breaches.json" || true
          # Curated tool catalogues, merged into the in-app directory.
          curl -sSL https://raw.githubusercontent.com/jivoi/awesome-osint/master/README.md -o "$A/awesome-osint.md" || true
          curl -sSL https://raw.githubusercontent.com/cipher387/osint_stuff_tool_collection/main/README.md -o "$A/osint-stuff.md" || true
          curl -sSL https://raw.githubusercontent.com/Astrosp/Awesome-OSINT-For-Everything/main/README.md -o "$A/osint-everything.md" || true
          curl -sSL https://raw.githubusercontent.com/Ph055a/OSINT_Collection/master/README.md -o "$A/osint-collection.md" || true
          for f in sherlock.json maigret.json un-sanctions.xml breaches.json awesome-osint.md osint-stuff.md osint-everything.md osint-collection.md; do
            if [ -s "$A/$f" ]; then
              echo "bundled $f ($(wc -c < "$A/$f") bytes)"
            else
              echo "WARNING: $f missing or empty"; rm -f "$A/$f"
            fi
          done
          # Raw infrastructure datasets -> compact JSON bundled in the APK.
          curl -sSL https://davidmegginson.github.io/ourairports-data/airports.csv -o /tmp/airports.csv || true
          curl -sSL https://raw.githubusercontent.com/wri/global-power-plant-database/master/output_database/global_power_plant_database.csv -o /tmp/powerplants.csv || true
          python3 - <<'PY'
          import csv, json
          A = "app/src/main/assets"
          try:
              out = []
              with open('/tmp/airports.csv', newline='', encoding='utf-8') as f:
                  for r in csv.DictReader(f):
                      if r.get('type') in ('large_airport', 'medium_airport'):
                          try:
                              lat = float(r['latitude_deg']); lon = float(r['longitude_deg'])
                          except Exception:
                              continue
                          code = (r.get('iata_code') or r.get('ident') or '').strip()
                          out.append({"lat": lat, "lon": lon, "n": (r.get('name') or '')[:60], "c": code})
              json.dump(out, open(A + "/airports.json", "w"))
              print("airports bundled:", len(out))
          except Exception as e:
              print("airports failed:", e)
          try:
              out = []
              with open('/tmp/powerplants.csv', newline='', encoding='utf-8') as f:
                  for r in csv.DictReader(f):
                      try:
                          lat = float(r['latitude']); lon = float(r['longitude'])
                      except Exception:
                          continue
                      out.append({"lat": lat, "lon": lon, "n": (r.get('name') or '')[:60],
                                  "f": r.get('primary_fuel') or '', "mw": r.get('capacity_mw') or ''})
              json.dump(out, open(A + "/powerplants.json", "w"))
              print("power plants bundled:", len(out))
          except Exception as e:
              print("power plants failed:", e)
          PY
          ls -la "$A"
          test -s "$A/arf.json"
          # Each dataset parsed and measured before it is allowed into the
          # APK, and hashed once it is. Every one of these arrives from a
          # third party's main branch with `|| true` behind it, so without
          # this the build happily bundles an error page and the app
          # reports "nothing found" for want of any rules to check.
          python3 .github/verify-assets.py
          # Ship the inventory inside the APK, so the self-test screen can
          # show on-device exactly which datasets this build carries.
          COUNTS=$(python3 .github/count-assets.py)
          printf '%s\n' "${COUNTS}" | sed 's/%0A/\n/g' > "$A/bundle-manifest.txt"
          cat "$A/bundle-manifest.txt"
          # Also report it back to the build. Downloads are best-effort
          # (|| true) so a dead mirror can't break the build, but a silently
          # missing dataset would be worse. These are notices, not errors:
          # they are information about a healthy build, and marking a green
          # build with error annotations is just noise.
          SUMMARY=""
          for f in "$A"/*; do
            SUMMARY="${SUMMARY}$(basename "$f") $(wc -c < "$f") bytes%0A"
          done
          echo "::notice title=bundled-assets::${SUMMARY}"
          echo "::notice title=rule-counts::${COUNTS}"

      # The condition reads the secret directly. It used to read an env
      # var defined in this same step, and a step's `if` is evaluated
      # before its own `env` block exists — so the condition was always
      # false and every build was signed with the committed key no matter
      # what secret had been set.
      - name: Use the private signing key when one is configured
        if: ${{ env.OSINT_KEYSTORE_B64 != '' }}
        run: |
          mkdir -p keystore
          echo "$OSINT_KEYSTORE_B64" | base64 -d > keystore/ci.jks
          test -s keystore/ci.jks
          echo "::notice title=signing::Signing with the configured private key."

      - name: Say so when the signing key is the public one
        if: ${{ env.OSINT_KEYSTORE_B64 == '' }}
        run: |
          echo "::warning title=signing::No OSINT_KEYSTORE_B64 secret is set, so this build is signed with the key committed to the repository. Anyone can sign an app with the same identity, which is what the database encryption assumes cannot happen."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile (surface Kotlin errors as annotations)
        run: |
          set +e
          gradle compileDebugKotlin --no-daemon --console=plain > compile.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "^e: " compile.log | head -40 | while IFS= read -r line; do
              clean="${line//$'\r'/}"
              echo "::error::${clean}"
            done
            echo "----- tail of compile log -----"
            tail -80 compile.log
            exit 1
          fi

      - name: Lint (security and accessibility only, as errors)
        run: |
          set +e
          gradle lintDebug --no-daemon --console=plain > lint.log 2>&1
          # The full lint is thousands of style notes; these two categories
          # are the ones that mean the app is unsafe or unusable, and they
          # are reported rather than buried.
          REPORT=app/build/reports/lint-results-debug.txt
          if [ -f "$REPORT" ]; then
            grep -iE "Security|Accessibility|Warning:" "$REPORT" | head -40 \
              | while IFS= read -r line; do echo "::warning::lint: ${line}"; done
            # An error here is fatal to assembleDebug anyway — lintVital
            # runs inside it, because debug is signed and not debuggable.
            # Failing at this step instead means the reason is annotated
            # rather than arriving as an exit code three steps later, which
            # is what happened to r172.
            if grep -qE "^.*: Error:" "$REPORT"; then
              grep -E "^.*: Error:" "$REPORT" | head -25 \
                | while IFS= read -r line; do echo "::error::lint: ${line}"; done
              exit 1
            fi
          fi
          exit 0

      - name: Run unit tests
        run: gradle test --no-daemon --stacktrace

      - name: Surface unit-test failures as annotations
        if: failure()
        run: python3 .github/test-report.py || true

      - name: Build debug APK
        env:
          OSINT_KEYSTORE_PASSWORD: ${{ secrets.OSINT_KEYSTORE_PASSWORD }}
          OSINT_KEY_ALIAS: ${{ secrets.OSINT_KEY_ALIAS }}
          OSINT_KEY_PASSWORD: ${{ secrets.OSINT_KEY_PASSWORD }}
        run: |
          # The log archive cannot be downloaded from where this project is
          # developed, so a failure here has to arrive as annotations or it
          # does not arrive at all. r169 failed in this step and said
          # nothing but "exit code 1".
          set +e
          gradle assembleDebug --no-daemon --console=plain \
            -PosintVersionCode=${{ github.run_number }} \
            -PosintVersionName=r${{ github.run_number }} > assemble.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            # Gradle states the reason in the block between "What went
            # wrong" and "* Try:". The tail of the log is not that block —
            # with --stacktrace it is forty frames of Gradle's own
            # internals, which is how r171 reported its failure.
            awk '/^\* What went wrong/,/^\* Try:/' assemble.log \
              | grep -v "^\* Try:" | head -25 | while IFS= read -r line; do
                clean="${line//$'\r'/}"
                [ -n "$clean" ] && echo "::error::${clean}"
              done
            # And the duplicate-class or packaging detail, which Gradle
            # prints outside that block.
            grep -nE "Duplicate class|More than one file|2 files found|is already present|No such property|Could not (find|resolve)" assemble.log \
              | head -10 | while IFS= read -r line; do
                clean="${line//$'\r'/}"
                echo "::error::${clean}"
              done
            echo "----- tail of assemble log -----"
            tail -120 assemble.log
            exit 1
          fi

      - name: Report the signing fingerprint and the APK size
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          SIZE=$(( $(wc -c < "$APK") / 1048576 ))
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
          FP=$("$APKSIGNER" verify --print-certs "$APK" 2>/dev/null \
                | grep -m1 -i "SHA-256 digest" | tr -d " " || echo "unknown")
          # The fingerprint must be identical between builds, or an update
          # will not install over the previous one.
          echo "::notice title=apk::${SIZE} MB%0Asigner ${FP}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: osint-unified-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Show Android SDK / NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"

      # Compile the pure-Go OSINT scanners for Android/arm64 using the NDK so
      # they use the device's system DNS resolver. Output as lib<tool>.so into
      # jniLibs (the one place Android lets an app execute binaries from).
      - name: Cross-compile Go tools into jniLibs
        run: |
          set -eux
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          CC_BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          OUT="app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$OUT"
          export GOOS=android GOARCH=arm64 CGO_ENABLED=1 CC="$CC_BIN"
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          BIN="$(go env GOPATH)/bin/android_arm64"
          cp "$BIN/subfinder" "$OUT/libsubfinder.so"
          cp "$BIN/httpx" "$OUT/libhttpx.so"
          chmod +x "$OUT"/*.so
          ls -la "$OUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile (surface Kotlin errors as annotations)
        run: |
          set +e
          gradle compileDebugKotlin --no-daemon --console=plain > compile.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "^e: " compile.log | head -40 | while IFS= read -r line; do
              clean="${line//$'\r'/}"
              echo "::error::${clean}"
            done
            echo "----- tail of compile log -----"
            tail -80 compile.log
            exit 1
          fi

      - name: Run unit tests
        run: gradle test --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: osint-unified-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

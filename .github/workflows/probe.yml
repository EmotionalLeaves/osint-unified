name: Probe endpoints

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Newline or comma separated URLs to probe"
        required: false
        default: ""
      list:
        description: "feeds, tools, or candidates"
        required: false
        default: "feeds"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe
        env:
          INPUT_URLS: ${{ github.event.inputs.urls }}
          INPUT_LIST: ${{ github.event.inputs.list }}
        run: |
          set +e
          # Through the environment, never interpolated into the script: a
          # workflow input pasted straight into bash is a command injection
          # by anyone who can dispatch the workflow.
          LIST="$INPUT_URLS"
          FILE=.github/probe-urls.txt
          if [ "$INPUT_LIST" = "tools" ]; then FILE=.github/probe-tools.txt; fi
          # Endpoints being considered as replacements for a dead or
          # regional feed, kept apart from the ones the app already calls.
          if [ "$INPUT_LIST" = "candidates" ]; then FILE=.github/probe-candidates.txt; fi
          if [ -z "$LIST" ] && [ -f "$FILE" ]; then
            LIST=$(cat "$FILE")
          fi
          echo "$LIST" | sed '/^[[:space:]]*$/d' > /tmp/urls.txt
          TOTAL=$(wc -l < /tmp/urls.txt)
          PER=$(( (TOTAL + 9) / 10 ))
          [ "$PER" -lt 1 ] && PER=1
          echo "probing $TOTAL urls, $PER per annotation"
          OUT=""
          N=0
          GROUP=1
          while read -r U; do
            # Trimmed with sed, not xargs: xargs parses shell quoting,
            # so a regex containing a double quote came through with the
            # quotes eaten and matched nothing.
            U=$(printf '%s' "$U" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            [ -z "$U" ] && continue
            UA='OSINT-Unified/1.0 (+https://github.com/EmotionalLeaves/osint-unified)'
            case "$U" in *'||'*) UA="${U##*||}"; U="${U%%||*}";; esac
            SKIP=1
            case "$U" in *'@@'*) SKIP="${U##*@@}"; U="${U%%@@*}";; esac
            # URL##regex shows the lines of the body that match, rather
            # than its first three hundred bytes. A capabilities document
            # is a quarter of a megabyte and the layer name is somewhere
            # in the middle of it.
            GREP=""
            case "$U" in *'##'*) GREP="${U##*##}"; U="${U%%##*}";; esac
            CODE=$(curl -sSL -o /tmp/body -w '%{http_code}' -m 25 \
              -H "User-Agent: $UA" \
              -H 'Accept: application/json,text/html,*/*' \
              "$U" 2>/tmp/err)
            SIZE=$(wc -c < /tmp/body 2>/dev/null || echo 0)
            if [ -n "$GREP" ]; then
              SNIP=$(grep -oE "$GREP" /tmp/body 2>/dev/null | sort -u | head -12 \
                | tr '\n' ' ' | tr -d '\r' | head -c 500 | sed 's/%/pct/g')
              [ -z "$SNIP" ] && SNIP="(no line matched)"
            else
              SNIP=$(tail -c +$SKIP /tmp/body | head -c 300 | tr -d '\r' | tr '\n' ' ' | sed 's/%/pct/g')
            fi
            [ -z "$CODE" ] && CODE="ERR:$(head -c 60 /tmp/err | tr '\n' ' ')"
            OUT="${OUT}[$CODE ${SIZE}b] $U%0A    $SNIP%0A"
            N=$((N+1))
            # GitHub shows at most ten notice annotations per step, so the
            # group size is chosen to fit the whole list into ten rather than
            # silently losing the tail.
            if [ $N -ge $PER ]; then
              echo "::notice title=probe-$GROUP::$OUT"
              OUT=""; N=0; GROUP=$((GROUP+1))
            fi
          done < /tmp/urls.txt
          if [ -n "$OUT" ]; then echo "::notice title=probe-$GROUP::$OUT"; fi
          # Annotations carry the results; the job itself succeeds.
          exit 0
